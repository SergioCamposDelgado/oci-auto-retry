name: Reintento Automatico OCI

on:
  schedule:
    # Se ejecuta automáticamente cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

# Permisos para que GitHub Actions pueda desactivar el workflow en caso de éxito
permissions:
  actions: write
  contents: read

jobs:
  apply-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar OCI CLI
        run: |
          pipx install oci-cli

      - name: Configurar credenciales OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Ejecutar Apply en el Stack
        id: oci_apply
        run: |
          echo "Lanzando intento en Oracle Cloud..."
          OUTPUT=$(oci resource-manager job create-apply-job \
            --stack-id "${{ secrets.OCI_STACK_ID }}" \
            --execution-plan-strategy AUTO_APPROVED \
            --wait-for-state SUCCEEDED \
            --wait-for-state FAILED 2>&1)
          
          echo "$OUTPUT"
          
          # Extraer el estado real del JSON devuelto por Oracle
          STATE=$(echo "$OUTPUT" | jq -r '.data["lifecycle-state"] // "UNKNOWN"')
          echo "Estado detectado en OCI: $STATE"
          
          if [ "$STATE" = "SUCCEEDED" ]; then
            echo "SUCCESS=true" >> $GITHUB_ENV
          else
            echo "SUCCESS=false" >> $GITHUB_ENV
            echo "Intento fallido por falta de capacidad o error de Terraform. Finalizando..."
            exit 1
          fi

      - name: Notificar por Telegram si se creó con éxito
        if: success() && env.SUCCESS == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 ¡ÉXITO! Tu instancia Ampere ARM se ha creado correctamente en Oracle Cloud."

      - name: Desactivar la automatización
        if: success() && env.SUCCESS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "¡Instancia creada! Desactivando el flujo de trabajo para no hacer más peticiones..."
          gh workflow disable "retry.yml"
